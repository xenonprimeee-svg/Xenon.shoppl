<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   XENON STORE — Shop
  </title>
  <link href="assets/css/css2" rel="stylesheet"/>
  <style>
   :root {
      --bg: #080c10;
      --surface: #0f1318;
      --surface2: #151a21;
      --surface3: #1c2330;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.12);
      --text: #eef2f7;
      --text2: #8a99b0;
      --muted: #4a5568;
      --accent: #10b981;
      --accent2: #34d399;
      --accent-dim: rgba(16, 185, 129, 0.12);
      --accent-glow: rgba(16, 185, 129, 0.25);
      --red: #f43f5e;
      --gold: #f5c842;
    }
    
    [data-theme="light"] {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface2: #f7fafc;
      --surface3: #edf2f7;
      --border: rgba(0, 0, 0, 0.08);
      --border2: rgba(0, 0, 0, 0.14);
      --text: #1a202c;
      --text2: #4a5568;
      --muted: #a0aec0;
    }
    
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(16, 185, 129, 0.06), transparent), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(56, 189, 248, 0.04), transparent);
      pointer-events: none;
      z-index: 0;
    }
    
    /* TOPBAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(8, 12, 16, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
      z-index: 200;
    }
    
    [data-theme="light"] .topbar {
      background: rgba(240, 244, 248, 0.95);
    }
    
    .hamburger {
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 8px;
      border-radius: 10px;
      transition: all .2s;
    }
    
    .hamburger:hover {
      background: var(--surface3);
      color: var(--text);
    }
    
    .logo-inline {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .18em;
      flex: 1;
      color: var(--text);
    }
    
    .logo-inline span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .avatar-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface3);
      border: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      cursor: pointer;
      transition: all .2s;
    }
    
    .avatar-btn:hover {
      background: var(--accent-dim);
      transform: scale(1.05);
    }
    
    /* SIDEBAR */
    .sidebar {
      position: fixed;
      top: 0;
      left: -290px;
      width: 272px;
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 300;
      transition: left .3s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    
    .sidebar.open {
      left: 0;
    }
    
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(4px);
      z-index: 299;
      display: none;
    }
    
    .sidebar-overlay.show {
      display: block;
    }
    
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 18px;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-dim);
      border: 1px solid rgba(16, 185, 129, .25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    
    .sidebar-logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    
    .sidebar-user {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-user-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
    }
    
    .sidebar-user-email {
      font-size: 11px;
      color: var(--muted);
      margin: 3px 0 10px;
      font-family: 'Space Mono', monospace;
    }
    
    .sidebar-points {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(16, 185, 129, .2);
      padding: 4px 12px;
      border-radius: 6px;
    }
    
    .sidebar-nav {
      padding: 10px;
      flex: 1;
    }
    
    .nav-section {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--muted);
      padding: 16px 10px 6px;
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      color: var(--text2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
      margin-bottom: 1px;
    }
    
    .nav-item:hover {
      background: var(--surface3);
      color: var(--text);
    }
    
    .nav-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    
    .admin-badge {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      background: var(--accent-dim);
      border: 1px solid rgba(16, 185, 129, .2);
      border-radius: 4px;
      color: var(--accent);
      margin-left: auto;
    }
    
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      transition: background .15s;
      margin-bottom: 1px;
    }
    
    .theme-toggle:hover {
      background: var(--surface3);
      color: var(--text);
    }
    
    .toggle-switch {
      margin-left: auto;
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: var(--surface3);
      border: 1px solid var(--border2);
      position: relative;
      transition: background .2s;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: all .2s;
    }
    
    [data-theme="light"] .toggle-switch {
      background: var(--accent);
    }
    
    [data-theme="light"] .toggle-switch::after {
      transform: translateX(16px);
      background: #fff;
    }
    
    .sidebar-footer {
      padding: 16px 18px;
      border-top: 1px solid var(--border);
    }
    
    .logout-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(244, 63, 94, .06);
      border: 1px solid rgba(244, 63, 94, .15);
      border-radius: 9px;
      color: var(--red);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    
    .logout-btn:hover {
      background: rgba(244, 63, 94, .12);
    }
    
    /* TOAST */
    .toast-container {
      position: fixed;
      top: 70px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .toast {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
      min-width: 240px;
      max-width: 320px;
      animation: toastIn .3s ease;
    }
    
    .toast.success {
      background: rgba(16, 185, 129, .15);
      border: 1px solid rgba(16, 185, 129, .3);
    }
    
    .toast.error {
      background: rgba(244, 63, 94, .12);
      border: 1px solid rgba(244, 63, 94, .25);
    }
    
    .toast-title {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
    }
    
    .toast-msg {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }
    
    .toast-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      margin-left: auto;
      padding: 0 0 0 8px;
    }
    
    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(20px)
      }
      
      to {
        opacity: 1;
        transform: translateX(0)
      }
    }
    
    /* MAIN */
    .main-content {
      padding-top: 60px;
      position: relative;
      z-index: 1;
    }
    
    .page-container {
      padding: 28px 20px 100px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* SHOP HEADER */
    .shop-header {
      margin-bottom: 28px;
    }
    
    .shop-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    
    .shop-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    
    .shop-header h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .shop-header p {
      color: var(--text2);
      font-size: 13px;
    }
    
    .points-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(16, 185, 129, .2);
      padding: 6px 14px;
      border-radius: 8px;
    }
    
    /* SEARCH + FILTER */
    .search-filter-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    
    .search-box {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    
    .search-box svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    
    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 11px 14px 11px 42px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    
    .search-box input:focus {
      border-color: var(--accent);
    }
    
    .search-box input::placeholder {
      color: var(--muted);
    }
    
    .category-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .cat-tab {
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      font-family: 'DM Sans', sans-serif;
    }
    
    .cat-tab:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    
    .cat-tab.active {
      background: linear-gradient(135deg, #10b981, #34d399);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 16px rgba(16, 185, 129, .3);
    }
    
    /* RESULTS */
    .results-count {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      font-family: 'Space Mono', monospace;
    }
    
    /* GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    
    @media(max-width:480px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }
    
    /* CARD */
    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all .25s;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    
    .game-card:hover {
      border-color: rgba(16, 185, 129, .4);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .4), 0 0 0 1px rgba(16, 185, 129, .15);
    }
    
    .game-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, var(--surface2), var(--surface3));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    
    .game-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s;
    }
    
    .game-card:hover .game-thumb img {
      transform: scale(1.04);
    }
    
    .game-cat-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, .75);
      border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 5px;
      font-family: 'Space Mono', monospace;
    }
    
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s;
      cursor: pointer;
    }
    
    .game-card:hover .thumb-overlay {
      opacity: 1;
    }
    
    .thumb-overlay-btn {
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .3);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
    }
    
    /* DOTS  */
    .three-dots-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      border: 1px solid rgba(255, 255, 255, .15);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      z-index: 10;
      transition: background .2s;
    }
    
    /* Extra safety: hide admin controls if body doesn't have is-admin class */
    body:not(.is-admin) .three-dots-btn,
    body:not(.is-admin) .dots-menu {
      display: none !important;
    }
    
    .three-dots-btn:hover {
      background: rgba(16, 185, 129, .8);
    }
    
    .dots-menu {
      position: absolute;
      top: 40px;
      right: 8px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
      z-index: 100;
      min-width: 170px;
      overflow: hidden;
      display: none;
      animation: fadeDown .15s ease;
    }
    
    .dots-menu.open {
      display: block;
    }
    
    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-6px)
      }
      
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }
    
    .dots-menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: background .15s;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
    }
    
    .dots-menu-item:hover {
      background: var(--accent-dim);
      color: var(--accent);
    }
    
    /* SOLD OUT */
    .game-card.is-soldout {
      opacity: .65;
      filter: grayscale(30%);
    }
    
    .soldout-banner {
      position: absolute;
      inset: 0;
      background: rgba(244, 63, 94, .1);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    
    .soldout-banner-label {
      background: rgba(244, 63, 94, .9);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 8px;
      letter-spacing: .06em;
    }
    
    .img-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
    }
    
    .img-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .4);
    }
    
    .img-dot.active {
      background: #fff;
    }
    
    /* CARD BODY */
    .game-card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    
    .game-name {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text);
      line-height: 1.3;
      white-space: normal;
      word-break: break-word;
    }
    
    .game-desc {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.55;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    
    .duration-prices {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
    }
    
    .duration-price-chip {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(16, 185, 129, .2);
      border-radius: 5px;
      color: var(--accent);
      font-family: 'Space Mono', monospace;
    }
    
    /* CARD FOOTER */
    .game-footer {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: auto;
    }
    
    .view-btn {
      flex: 1;
      min-width: 60px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 8px 0;
      color: var(--text2);
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    
    .view-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .buy-btn {
      flex: 1;
      min-width: 60px;
      background: linear-gradient(135deg, #10b981, #34d399);
      border: none;
      border-radius: 9px;
      padding: 8px 0;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      text-align: center;
    }
    
    .buy-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 4px 16px rgba(16, 185, 129, .45);
    }
    
    .comment-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 6px 10px;
      color: var(--text2);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      font-family: 'DM Sans', sans-serif;
      width: 100%;
    }
    
    .comment-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .msg-admin-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-dim);
      border: 1px solid rgba(16, 185, 129, .3);
      border-radius: 9px;
      padding: 6px 10px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      font-family: 'DM Sans', sans-serif;
      width: 100%;

   import {

} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {

    ref,
    onValue,
    get,
    set,
    push,
    update
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyA4JpEiy3lJZCDhoi1g7zNXqKzbdI0SAsM",
    authDomain: "messengerchatapp-7c754.firebaseapp.com",
    databaseURL: "https://messengerchatapp-7c754-default-rtdb.firebaseio.com",
    projectId: "messengerchatapp-7c754",
    storageBucket: "messengerchatapp-7c754.firebasestorage.app",
    messagingSenderId: "78446807414",
    appId: "1:78446807414:web:e1879f4bd9f10115e81257",
    measurementId: "G-VBWRC4SWL5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const theme = localStorage.getItem('theme') || 'dark';
if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');

let allGames = {},
    currentCategory = 'all',
    currentUser = null,
    currentUserData = {},
    isAdmin = false;
let lastKnownPurchaseTs = Date.now(),
    buyNotifQueue = [],
    isBuyNotifShowing = false;

function showBuyNotif(userName, gameName) {
    buyNotifQueue.push({
        userName,
        gameName
    });
    processBuyNotifQueue();
}

function processBuyNotifQueue() {
    if (isBuyNotifShowing || buyNotifQueue.length === 0) return;
    isBuyNotifShowing = true;
    const {
        userName,
        gameName
    } = buyNotifQueue.shift();
    const container = document.getElementById('buyNotifContainer');
    const initial = (userName || 'U')[0].toUpperCase();
    const div = document.createElement('div');
    div.className = 'buy-notif';
    div.innerHTML = `<div class="buy-notif-avatar">${initial}</div><div class="buy-notif-text"><div class="buy-notif-name">${userName}</div><div class="buy-notif-msg">just bought "${gameName}" 🎉</div></div><div>🛒</div>`;
    container.appendChild(div);
    setTimeout(() => {
        div.classList.add('hiding');
        setTimeout(() => {
            div.remove();
            isBuyNotifShowing = false;
            processBuyNotifQueue();
        }, 380);
    }, 4000);
}

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = 'login.html';
        return;
    }
    currentUser = user;
    const snap = await get(ref(db, 'users/' + user.uid));
    currentUserData = snap.val() || {};
    isAdmin = currentUserData.role === 'admin';
    if (isAdmin) document.body.classList.add('is-admin');
    injectSidebar(currentUserData, isAdmin);

    onValue(ref(db, 'users/' + user.uid + '/points'), s => {
        currentUserData.points = s.val() || 0;
        document.getElementById('headerPtsNum').textContent = currentUserData.points;
    });
    onValue(ref(db, 'games'), s => {
        allGames = s.val() || {};
        renderGames();
    });
    onValue(ref(db, 'purchaseLogs'), snap2 => {
        const data = snap2.val();
        if (!data) return;
        Object.values(data).forEach(log => {
            if (log.ts && log.ts > lastKnownPurchaseTs) {
                lastKnownPurchaseTs = log.ts;
                showBuyNotif(log.userName || 'Someone', (allGames[log.gameId]?.name) || log.gameName || 'a product');
            }
        });
    });
});

setInterval(() => {
    document.querySelectorAll('[id^="ptimer-"]').forEach(el => {
        const endTs = parseInt(el.dataset.end);
        if (!endTs) return;
        const diff = endTs - Date.now();
        if (diff <= 0) {
            el.querySelector('.ptimer-val').textContent = 'Expired';
            return;
        }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        const val = el.querySelector('.ptimer-val');
        if (val) val.textContent = h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
    });
}, 1000);

    });

function getTimeAgo(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts,
        m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h / 24);
    if (d < 7) return d + 'd ago';
    return new Date(ts).toLocaleDateString();
}

window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
};
window.closeSidebar = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
};
window.toggleTheme = () => {
    const c = document.documentElement.getAttribute('data-theme');
    const n = c === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('theme', n);
};
window.doLogout = async () => {
    await signOut(auth);
    window.location.href = 'login.html';
};
