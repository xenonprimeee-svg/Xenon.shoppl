<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   XENON STORE — Verify
  </title>
  <link href="assets/css/css2" rel="stylesheet"/>
  <style>
   :root {
      --gold: #F5C842;
      --gold2: #FFB020;
      --gold-dim: rgba(245, 200, 66, 0.18);
      --gold-glow: rgba(245, 200, 66, 0.08);
      --surface: #080808;
      --surface2: #0D0D0D;
      --surface3: #141414;
      --surface4: #1C1C1C;
      --surface5: #242424;
      --border: rgba(255, 255, 255, 0.05);
      --border-gold: rgba(245, 200, 66, 0.18);
      --text: #F0EDE8;
      --text2: #A89F92;
      --text3: #5C5650;
      --success: #4ADE80;
      --error: #FF6B6B;
      --cyan: #38BDF8;
    }
    [data-theme="light"] {
      --surface: #F5F2EC;
      --surface2: #FFFFFF;
      --surface3: #EDE9E1;
      --surface4: #E4DFD5;
      --surface5: #D8D2C8;
      --border: rgba(0, 0, 0, 0.06);
      --border-gold: rgba(180, 140, 20, 0.25);
      --text: #1A1714;
      --text2: #5C5650;
      --text3: #9C9488;
      --gold: #C8A020;
      --gold2: #B08818;
      --gold-dim: rgba(200, 160, 32, 0.12);
      --gold-glow: rgba(200, 160, 32, 0.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--surface);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9998;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-gold {
      width: 500px; height: 500px;
      top: -150px; right: -100px;
      background: radial-gradient(ellipse, rgba(245, 200, 66, 0.08), transparent 65%);
    }
    .orb-blue {
      width: 400px; height: 400px;
      bottom: -100px; left: -100px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.05), transparent 65%);
    }

    /* CARD */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(245,200,66,0.04);
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--gold-dim);
      border: 1px solid var(--border-gold);
      display: flex; align-items: center; justify-content: center;
      color: var(--gold);
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 16px; font-weight: 800;
      letter-spacing: 0.16em;
    }
    .logo-text span { background: linear-gradient(90deg, var(--gold), var(--gold2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .shield-wrap {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: var(--gold-dim);
      border: 1px solid var(--border-gold);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      color: var(--gold);
      position: relative;
    }
    .shield-wrap::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      background: radial-gradient(ellipse at top, rgba(245,200,66,0.15), transparent 70%);
    }
    .shield-pulse {
      position: absolute;
      inset: -10px;
      border-radius: 28px;
      border: 1px solid rgba(245,200,66,0.18);
      animation: pulse 2s ease-in-out infinite;
    }
    .shield-pulse2 {
      position: absolute;
      inset: -20px;
      border-radius: 36px;
      border: 1px solid rgba(245,200,66,0.08);
      animation: pulse 2s ease-in-out infinite 0.4s;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.04); }
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: var(--text2);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 28px;
    }


    .captcha-box {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .captcha-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text3);
      margin-bottom: 12px;
    }
    .math-problem {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .math-num {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
    }
    .math-op {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--text2);
      line-height: 1;
    }
    .math-eq {
      font-family: 'Space Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--text3);
    }
    .math-input {
      width: 80px;
      background: var(--surface4);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .math-input:focus { border-color: var(--gold); }
    .math-input.wrong { border-color: var(--error); animation: shake 0.3s ease; }
    .math-input.right { border-color: var(--success); }
    @keyframes shake {
      0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
    }

    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px;
      color: var(--text3);
      background: none; border: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: color 0.2s;
      margin: 0 auto;
    }
    .refresh-btn:hover { color: var(--text2); }
    .refresh-btn svg { transition: transform 0.4s; }
    .refresh-btn:hover svg { transform: rotate(180deg); }

    /* CHECKBOX CONFIRM */
    .check-row {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      margin-bottom: 18px;
      transition: border-color 0.2s;
      user-select: none;
    }
    .check-row:hover { border-color: rgba(245,200,66,0.2); }
    .check-row.checked { border-color: var(--border-gold); background: var(--gold-dim); }
    .check-box {
      width: 20px; height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--surface4);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
      transition: all 0.2s;
    }
    .check-row.checked .check-box {
      background: var(--gold);
      border-color: var(--gold);
    }
    .check-row.checked .check-box svg { display: block; }
    .check-box svg { display: none; }
    .check-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .check-row.checked .check-text { color: var(--text); }

    /* ERROR */
    .err-msg {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--error);
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.18);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }
    .err-msg.show { display: flex; }

    /* BUTTON */
    .btn-verify {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border: none;
      border-radius: 12px;
      color: #0a0800;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn-verify::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-verify:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(245,200,66,0.3); }
    .btn-verify:hover::before { opacity: 1; }
    .btn-verify:active { transform: translateY(0); }
    .btn-verify:disabled {
      background: var(--surface5);
      color: var(--text3);
      cursor: not-allowed;
      transform: none; box-shadow: none;
    }

    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottom-note {
      text-align: center;
      font-size: 11px;
      color: var(--text3);
      margin-top: 16px;
      font-family: 'Space Mono', monospace;
    }

    /* PROGRESS BAR */
    .step-bar {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 28px;
    }
    .step-item {
      display: flex; align-items: center; gap: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text3);
    }
    .step-item.done .step-dot { background: var(--success); }
    .step-item.active .step-dot { background: var(--gold); box-shadow: 0 0 8px rgba(245,200,66,0.5); }
    .step-item.done .step-label { color: var(--text2); }
    .step-item.active .step-label { color: var(--gold); }
    .step-label { color: var(--text3); }
    .step-line {
      flex: 1;
      height: 1px;
      background: var(--border);
      margin: 0 8px;
    }
    .step-line.done { background: rgba(74,222,128,0.4); }
  </style>
 </head>
 <body>
  <div class="orb orb-gold">
  </div>
  <div class="orb orb-blue">
  </div>
  <div class="card">
   <!-- Logo -->
   <div class="logo-mark">
    <div class="logo-icon">
     <svg fill="none" height="18" viewbox="0 0 24 24" width="18">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      </path>
     </svg>
    </div>
    <span class="logo-text">
     XENON
     <span>
      STORE
     </span>
    </span>
   </div>
   <!-- Steps -->
   <div class="step-bar">
    <div class="step-item done">
     <div class="step-dot">
     </div>
     <span class="step-label">
      Preview
     </span>
    </div>
    <div class="step-line done">
    </div>
    <div class="step-item active">
     <div class="step-dot">
     </div>
     <span class="step-label">
      Verify
     </span>
    </div>
    <div class="step-line">
    </div>
    <div class="step-item">
     <div class="step-dot">
     </div>
     <span class="step-label">
      Access
     </span>
    </div>
    <div class="step-line">
    </div>
    <div class="step-item">
     <div class="step-dot">
     </div>
     <span class="step-label">
      Done
     </span>
    </div>
   </div>
   <div class="shield-wrap">
    <div class="shield-pulse">
    </div>
    <div class="shield-pulse2">
    </div>
    <svg fill="none" height="32" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24" width="32">
     <path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round">
     </path>
    </svg>
   </div>
   <div class="card-title">
    Security Check
   </div>
   <div class="card-sub">
    Solve the quick math puzzle to prove
    <br/>
    you're not a bot before your order proceeds.
   </div>
   <!-- Math Captcha -->
   <div class="captcha-box">
    <div class="captcha-label">
     Solve to continue
    </div>
    <div class="math-problem">
     <div class="math-num" id="numA">
      —
     </div>
     <div class="math-op" id="opSymbol">
      +
     </div>
     <div class="math-num" id="numB">
      —
     </div>
     <div class="math-eq">
      =
     </div>
     <input class="math-input" id="mathAnswer" inputmode="numeric" maxlength="3" oninput="checkRealtime()" placeholder="?" type="number"/>
    </div>
    <button class="refresh-btn" onclick="newProblem()">
     <svg fill="none" height="13" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" width="13">
      <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round">
      </path>
     </svg>
     New problem
    </button>
   </div>
   <div class="check-row" id="checkRow" onclick="toggleCheck()">
    <div class="check-box">
     <svg fill="none" height="12" stroke="#0a0800" stroke-width="3.5" viewbox="0 0 24 24" width="12">
      <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round">
      </path>
     </svg>
    </div>
    <span class="check-text">
     I confirm this is a real purchase and I'm not using automation or bots.
    </span>
   </div>
   <!-- Error -->
   <div class="err-msg" id="errMsg">
    <svg fill="none" height="14" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" width="14">
     <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" stroke-linecap="round" stroke-linejoin="round">
     </path>
    </svg>
    <span id="errText">
     Please solve the math problem correctly.
    </span>
   </div>
   <button class="btn-verify" id="verifyBtn" onclick="verify()">
    <svg fill="none" height="16" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" width="16">
     <path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round">
     </path>
    </svg>
    Continue to Processing
   </button>
   <div class="bottom-note">
    secure buying
   </div>
  </div>
  <script type="module">
   import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA4JpEiy3lJZCDhoi1g7zNXqKzbdI0SAsM",
    authDomain: "messengerchatapp-7c754.firebaseapp.com",
    databaseURL: "https://messengerchatapp-7c754-default-rtdb.firebaseio.com",
    projectId: "messengerchatapp-7c754",
    storageBucket: "messengerchatapp-7c754.firebasestorage.app",
    messagingSenderId: "78446807414",
    appId: "1:78446807414:web:e1879f4bd9f10115e81257",
    measurementId: "G-VBWRC4SWL5"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const theme = localStorage.getItem('theme') || 'dark';
if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');

// Pass gameId along
const params = new URLSearchParams(location.search);
const gameId = params.get('id');

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = 'login.html';
        return;
    }
});

// Math captcha logic
let correctAnswer = 0;
let isChecked = false;

window.newProblem = function() {
    const a = Math.floor(Math.random() * 15) + 1;
    const b = Math.floor(Math.random() * 15) + 1;
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    document.getElementById('numA').textContent = a;
    document.getElementById('opSymbol').textContent = op;
    document.getElementById('numB').textContent = b;
    if (op === '+') correctAnswer = a + b;
    else if (op === '-') correctAnswer = a - b;
    else correctAnswer = a * b;
    const inp = document.getElementById('mathAnswer');
    inp.value = '';
    inp.classList.remove('wrong', 'right');
    document.getElementById('errMsg').classList.remove('show');
};

window.checkRealtime = function() {
    const inp = document.getElementById('mathAnswer');
    const val = parseInt(inp.value);
    if (isNaN(val)) {
        inp.classList.remove('wrong', 'right');
        return;
    }
    if (val === correctAnswer) inp.classList.add('right'), inp.classList.remove('wrong');
    else inp.classList.remove('right');
};

window.toggleCheck = function() {
    isChecked = !isChecked;
    document.getElementById('checkRow').classList.toggle('checked', isChecked);
};

window.verify = function() {
    const inp = document.getElementById('mathAnswer');
    const errMsg = document.getElementById('errMsg');
    const errText = document.getElementById('errText');
    const val = parseInt(inp.value);

    if (val !== correctAnswer) {
        inp.classList.add('wrong');
        inp.classList.remove('right');
        errText.textContent = 'Wrong answer. Try solving the math problem again.';
        errMsg.classList.add('show');
        setTimeout(() => inp.classList.remove('wrong'), 400);
        return;
    }
    if (!isChecked) {
        errText.textContent = 'Please confirm the checkbox above.';
        errMsg.classList.add('show');
        return;
    }
    errMsg.classList.remove('show');
    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="spin" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Verifying…';
    setTimeout(() => {
        window.location.href = 'getting-access.html' + (gameId ? '?id=' + gameId : '');
    }, 1200);
};

// Init
newProblem();
  </script>
 </body>
</html>
